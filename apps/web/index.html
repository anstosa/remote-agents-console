<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Remote Agent Console manages coding agents, worktrees and project tools, with an optional Google Calendar timeline of agent work."/>
  <meta name="theme-color" content="#1e1e2e"/>
  <script src="/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Agents"/>
  <title>Remote Agent Console</title>
</head>
<body>
<div id="root">
<!-- publish the complete homepage without flashing it before authenticated session restoration -->
<noscript>
<main class="public-homepage">
  <div class="public-homepage-shell">
    <header class="public-homepage-header">
      <a class="public-homepage-brand" href="/" aria-label="Remote Agent Console home"><span aria-hidden="true">&gt;_</span><strong>Remote Agent Console</strong></a>
      <nav class="public-homepage-nav" aria-label="Homepage"><a href="#capabilities">How it works</a><a href="#google-calendar">Google Calendar</a></nav>
    </header>
    <section class="public-homepage-hero" aria-labelledby="public-homepage-title">
      <div class="public-homepage-hero-copy">
        <p class="public-homepage-eyebrow">REMOTE // AGENTS</p>
        <h1 id="public-homepage-title">Remote Agent Console</h1>
        <p class="public-homepage-lede">Manage coding agents and their worktrees from one self-hosted console.</p>
        <p>RAC brings agent sessions, repository work and project tools into a single browser workspace while keeping access behind your console password.</p>
        <div class="public-homepage-actions"><a class="public-homepage-login public-homepage-login-link" href="#login">Log in <span aria-hidden="true">↗</span></a><a class="public-homepage-secondary" href="#capabilities">Explore functionality</a></div>
        <p>Enable JavaScript to log in to the console. All product and privacy information is available below without logging in.</p>
      </div>
      <div class="public-homepage-summary" aria-label="Product summary"><p>Built for active development work</p><ul><li>Configured Codex, Claude and OMX workflows</li><li>Live agent output, prompts and project tools</li><li>Repository and review context in one workspace</li></ul></div>
    </section>
    <section class="public-homepage-section" id="capabilities" aria-labelledby="capabilities-title">
      <p class="public-homepage-eyebrow">WHAT RAC DOES</p>
      <h2 id="capabilities-title">One place to direct and inspect agent work</h2>
      <div class="public-homepage-capabilities">
        <article><h3>Run agents</h3><p>Launch and monitor configured coding agents, send or queue prompts and schedule repeatable work.</p></article>
        <article><h3>See the work</h3><p>Follow terminal output, inspect files and keep notes beside the agent session that produced them.</p></article>
        <article><h3>Manage repositories</h3><p>Work across repositories, worktrees and branches, then inspect pull requests, changes and guided reviews.</p></article>
        <article><h3>Use project tools</h3><p>Open project processes, terminals and browser previews without losing the active agent context.</p></article>
      </div>
      <p class="public-homepage-data">This installation stores workspace configuration, prompts, history and notes to provide these tools. Prompts you submit are processed by your selected coding-agent provider under its own policies.</p>
    </section>
    <section class="public-homepage-section public-homepage-calendar" id="google-calendar" aria-labelledby="google-calendar-title">
      <p class="public-homepage-eyebrow">OPT-IN INTEGRATION</p>
      <h2 id="google-calendar-title">Optional Google Calendar integration</h2>
      <p>After logging in, you can optionally connect Google Calendar to create a dedicated timeline of supported agent work. Event titles use your configured worktree, project or agent labels, and event start and end times come only from selected lifecycle moments backed by exact agent evidence.</p>
      <p>To connect the selected Google account, RAC receives its account ID and email and stores encrypted access and refresh tokens to maintain the connection. The <code>calendar.app.created</code> permission lets RAC create and manage only the secondary calendars and events that RAC creates.</p>
      <p>RAC does not automatically put prompts, responses, file contents or filesystem paths into Google Calendar. Google API data is not sold, used for advertising or used to train AI models.</p>
      <p>Console password login is separate from Google authorization. Connecting Google is optional, happens only after login and can be revoked.</p>
      <p>Read the <a href="/privacy">Privacy Policy</a> for the complete data, storage, retention and revocation details.</p>
    </section>
    <footer class="public-homepage-footer"><span>Remote Agent Console</span><nav aria-label="Legal policies"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a></nav></footer>
  </div>
</main>
</noscript>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
