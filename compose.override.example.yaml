services:
  remote-agent-console:
    environment:
      # set HOST_UID to id -u and install scripts/install-host-tmux.sh on the host
      # enable discovery and control of the host tmux server
      RAC_HOST_PROC: /host-proc
      RAC_HOST_TMUX_DIR: /host-tmux
      RAC_HOST_TMUX_SOURCE: ${HOST_TMUX_DIR:-${HOME}/.local/state/tmux/tmux-${HOST_UID:-1000}}
      RAC_HOST_UID: ${HOST_UID:-1000}
      # optionally pin host node for Files access; blank uses node from host PATH
      # the container and host tmux account must have matching numeric uids
      RAC_HOST_NODE_BIN: ${RAC_HOST_NODE_BIN:-}
      RAC_TMUX_BIN: /host-tools/tmux
      RAC_HOST_REPOSITORY: ${RAC_HOST_REPOSITORY:-${PWD}}
      # map stack status files back to the host checkout
      RAC_HOST_WORKSPACE: ${RAC_HOST_WORKSPACE:-${PWD}}
      # keep container-only account services off host-only adapter paths
      RAC_CODEX_BIN: /usr/local/bin/codex
      # optionally override the host-tmux advisor's configured adapter path
      RAC_HOST_CODEX_BIN: ${RAC_HOST_CODEX_BIN:-}
      RAC_HOST_INTERACTIVE_SHELL: ${RAC_HOST_INTERACTIVE_SHELL:-/usr/bin/zsh}
      RAC_HOST_PATH: ${RAC_HOST_PATH:-/usr/local/bin:/usr/bin:/bin}
    volumes:
      # share the complete Codex home for atomic account switches
      - ${HOME}/.codex:/home/node/.codex:rw
      # share GitHub CLI credentials for pull request lookups
      - ${HOME}/.config/gh:/home/node/.config/gh:ro
      # expose the host process tree, tmux socket, and a compatible tmux client
      - /proc:/host-proc:ro
      - ${HOST_TMUX_DIR:-${HOME}/.local/state/tmux/tmux-${HOST_UID:-1000}}:/host-tmux:ro
      - ${HOST_TMUX_BIN:-/usr/bin/tmux}:/host-tools/tmux:ro
      # map each configured worktree on this host
      - /absolute/path/to/project:/worktrees/project:rw
      # keep research-only worktrees read-only
      - /absolute/path/to/research:/worktrees/research:ro
