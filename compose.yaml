services:
  remote-agent-console:
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.164.0}
    restart: unless-stopped
    init: true
    # The application intentionally binds to loopback. Host networking keeps
    # that boundary while making 127.0.0.1:8787 reachable from the host.
    network_mode: host
    env_file:
      - .env
    environment:
      RAC_CONFIG: /workspace/config/remote-agent-console.docker.json
      RAC_CONFIG_WRITE_PATH: /workspace/config/remote-agent-console.docker.json
      # the packaged image runs from /app, so the server's own checkout is the mount
      RAC_SERVER_CHECKOUT: /workspace
      # expose the bundled agent version for runtime diagnostics
      CODEX_VERSION: ${CODEX_VERSION:-0.164.0}
      # linux host networking reaches project ports through loopback
      RAC_PROJECT_PROXY_HOST: ${RAC_PROJECT_PROXY_HOST:-127.0.0.1}
      RAC_DEVICE_NAMES_FILE: /workspace/.data/device-names.json
      RAC_SAVED_PROMPTS_FILE: /workspace/.data/saved-prompts.json
      RAC_PROMPT_HISTORY_FILE: /workspace/.data/prompt-history.json
      RAC_QUEUED_PROMPTS_FILE: /workspace/.data/queued-prompts.json
      # persist browser registrations and their automatically managed signing identity
      RAC_PUSH_SUBSCRIPTIONS_FILE: /workspace/.data/push-subscriptions.json
      RAC_TEMP_PREVIEWS_DIR: /workspace/.data/temp-previews
      RAC_NOTES_FILE: /workspace/.data/notes.json
      # persist exact-place favorites and identity-bound operation recovery
      RAC_FILE_FAVORITES_FILE: /workspace/.data/file-favorites.json
      RAC_FILE_OPERATION_JOURNAL: /workspace/.data/file-operation-journal.json
      # retired at boot (Conversations replaced bookmarks); kept so the one-time retirement finds the mounted file
      RAC_BOOKMARKS_FILE: /workspace/.data/bookmarks.json
      RAC_REVIEW_TOURS_FILE: /workspace/.data/review-tours.json
      RAC_INTEGRATION_AUTH_FILE: /workspace/.data/integration-auth.json
      RAC_INTEGRATION_STATE_FILE: /workspace/.data/integration-state.json
      RAC_INTEGRATION_AUDIT_FILE: /workspace/.data/integration-audit.jsonl
      RAC_GOOGLE_CALENDAR_AUTH_FILE: /workspace/.data/google-calendar-auth.json
      RAC_GOOGLE_CALENDAR_ACTIVITIES_FILE: /workspace/.data/google-calendar-activities.json
      RAC_GOOGLE_CALENDAR_LIFECYCLE_FILE: /workspace/.data/google-calendar-lifecycle.json
    volumes:
      - ./:/workspace:rw
      - codex-home:/home/node/.codex
      # inherit the host zone unless .env explicitly sets TZ
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # The host configuration and tunnel credential are intentionally
    # owner-readable only. Run this sidecar as root so its read-only bind mounts
    # remain usable without weakening their host permissions.
    user: "0:0"
    restart: unless-stopped
    # keep the connector independent while reaching the loopback-only origin
    network_mode: host
    depends_on:
      remote-agent-console:
        condition: service_healthy
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - type: bind
        source: ./config/cloudflared.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLOUDFLARED_CREDENTIALS_FILE:-./config/cloudflared.credentials.json}
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false

  # keep dashboard-managed connector tokens out of argv and Compose environment
  cloudflared-token:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-token"]
    user: "0:0"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: host
    depends_on:
      remote-agent-console:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflared-token
    volumes:
      - type: bind
        source: ./config/cloudflared.token
        target: /run/secrets/cloudflared-token
        read_only: true
        bind:
          create_host_path: false

volumes:
  codex-home:
